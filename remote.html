<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Double Exposure — Remote</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Outfit:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --gold: #b8966e;
            --gold-light: #d4b896;
            --bg: #0a0a0a;
            --card: #131313;
            --border: rgba(184, 150, 110, 0.2);
            --border-solid: #252525;
            --text: #e0e0e0;
            --text-dim: rgba(224, 224, 224, 0.5);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            width: 100%;
            text-align: center;
            padding: 32px 20px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0;
        }

        .header-rule {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .header-rule span {
            height: 1px;
            width: 40px;
            background: linear-gradient(90deg, transparent, var(--gold));
        }

        .header-rule span:last-child { transform: scaleX(-1); }

        .header-rule i {
            font-style: normal;
            color: var(--gold);
            font-size: 0.55rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            opacity: 0.6;
        }

        h1 {
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            margin: 0;
        }

        /* ── Status bar ── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #555;
            transition: background 0.4s;
            flex-shrink: 0;
        }

        .status-dot.connecting { background: #c8a040; animation: dot-pulse 1.2s ease-in-out infinite; }
        .status-dot.connected  { background: #5bba6f; }
        .status-dot.error      { background: #d47070; }

        @keyframes dot-pulse {
            0%, 100% { opacity: 0.4; }
            50%       { opacity: 1; }
        }

        .status-text {
            font-size: 0.68rem;
            color: var(--text-dim);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        /* ── Content wrapper ── */
        .content {
            width: 100%;
            max-width: 420px;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ── Upload Card ── */
        .upload-card {
            background: var(--card);
            border: 1px solid var(--border-solid);
            border-top: 2px solid rgba(184, 150, 110, 0.28);
            padding: 22px 20px 20px;
            text-align: center;
        }

        .upload-card.uploaded {
            border-top-color: rgba(184, 150, 110, 0.7);
            border-color: rgba(184, 150, 110, 0.25);
        }

        .slot-title {
            font-size: 0.65rem;
            margin-bottom: 16px;
            opacity: 0.7;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .slot-check {
            display: none;
            width: 14px;
            height: 14px;
            border: 1px solid rgba(91, 186, 111, 0.6);
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 0.45rem;
            color: #5bba6f;
        }

        .upload-card.uploaded .slot-check { display: inline-flex; }

        /* ── Button ── */
        .btn {
            background: var(--gold);
            color: #0a0a0a;
            border: none;
            padding: 18px 20px;
            border-radius: 0;
            font-family: 'DM Mono', monospace;
            font-weight: 400;
            font-size: 0.72rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            width: 100%;
            min-height: 56px;
            cursor: pointer;
            transition: background 0.2s, transform 0.12s, opacity 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.55s;
        }

        .btn:hover::before { transform: translateX(100%); }
        .btn:hover { background: #d4b896; }
        .btn:active { transform: scale(0.98); }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn:disabled::before { display: none; }

        /* ── File input ── */
        input[type="file"] { display: none; }

        /* ── Preview ── */
        .preview-wrap {
            position: relative;
            display: inline-block;
            margin-top: 14px;
        }

        .preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            display: none;
            border: 1px solid rgba(184, 150, 110, 0.4);
            filter: sepia(12%) brightness(0.88);
        }

        .preview-overlay {
            position: absolute;
            inset: 0;
            background: rgba(91, 186, 111, 0.15);
            border: 1px solid rgba(91, 186, 111, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .upload-card.uploaded .preview-overlay { display: flex; }

        /* ── Loading ── */
        .loading {
            margin-top: 14px;
            font-size: 0.65rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
            display: none;
            animation: loading-pulse 1.4s ease-in-out infinite;
            min-height: 1.2em;
        }

        @keyframes loading-pulse {
            0%, 100% { opacity: 0.4; }
            50%       { opacity: 1; }
        }

        /* ── Debug card ── */
        .debug-card {
            background: transparent;
            border: 1px solid var(--border-solid);
            padding: 18px 20px;
            text-align: center;
            opacity: 0.6;
        }

        .debug-title {
            font-size: 0.58rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .debug-btn {
            background: rgba(255,255,255,0.05);
            color: var(--text-dim);
            border: 1px solid var(--border-solid);
            padding: 12px 20px;
            min-height: 44px;
            width: 100%;
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .debug-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(184, 150, 110, 0.4);
            color: var(--text);
        }

        .ping-status {
            margin-top: 10px;
            font-size: 0.62rem;
            letter-spacing: 0.15em;
            color: var(--gold);
            min-height: 1.2em;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .ping-status.visible { opacity: 1; }

        /* ── Disconnect button ── */
        .btn-disconnect {
            background: transparent;
            color: #d47070;
            border: 1px solid rgba(212, 112, 112, 0.3);
            padding: 14px 20px;
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            width: 100%;
            min-height: 48px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            margin-top: 8px;
        }

        .btn-disconnect:hover {
            background: rgba(212, 112, 112, 0.08);
            border-color: rgba(212, 112, 112, 0.55);
        }

        .btn-disconnect:active { transform: scale(0.98); }

        .btn-disconnect:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ── Disconnected overlay ── */
        #disconnected-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 40px 24px;
            text-align: center;
        }

        #disconnected-screen.visible {
            display: flex;
        }

        .disc-icon {
            font-size: 2.2rem;
            opacity: 0.5;
        }

        .disc-title {
            font-size: 0.8rem;
            color: var(--gold);
            letter-spacing: 0.4em;
            text-transform: uppercase;
        }

        .disc-sub {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.18em;
            line-height: 1.8;
            max-width: 260px;
        }

        .disc-rule {
            width: 48px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        /* ── Focus ring ── */
        *:focus-visible {
            outline: 1.5px solid var(--gold);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-rule">
            <span></span>
            <i>Remote Upload</i>
            <span></span>
        </div>
        <h1>Double Exposure</h1>
        <div class="status-bar">
            <div class="status-dot connecting" id="statusDot"></div>
            <span class="status-text" id="status">Connecting...</span>
        </div>
    </header>

    <div class="content">

        <div class="upload-card" id="card1">
            <div class="slot-title">
                Layer I — Portrait
                <span class="slot-check">✓</span>
            </div>
            <button class="btn" id="btn1">Select Image</button>
            <input type="file" id="file1" accept="image/*">
            <div class="preview-wrap">
                <img id="prev1" class="preview" alt="Layer I preview">
                <div class="preview-overlay">✓</div>
            </div>
            <div id="loading1" class="loading"></div>
        </div>

        <div class="upload-card" id="card2">
            <div class="slot-title">
                Layer II — Texture
                <span class="slot-check">✓</span>
            </div>
            <button class="btn" id="btn2">Select Image</button>
            <input type="file" id="file2" accept="image/*">
            <div class="preview-wrap">
                <img id="prev2" class="preview" alt="Layer II preview">
                <div class="preview-overlay">✓</div>
            </div>
            <div id="loading2" class="loading"></div>
        </div>

        <button class="btn-disconnect" id="disconnectBtn">Disconnect from Kiosk</button>

        <!-- Debug: Connection Test (hidden in production) -->
        <div class="debug-card" style="display:none">
            <div class="debug-title">Connection Test</div>
            <button class="debug-btn" id="pingBtn">Ping Kiosk</button>
            <div id="pingStatus" class="ping-status"></div>
        </div>

    </div>

    <div id="disconnected-screen">
        <div class="disc-icon">⬡</div>
        <div class="disc-rule"></div>
        <div class="disc-title">Session Ended</div>
        <div class="disc-sub">Scan the QR code on the kiosk to start a new session.</div>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const kioskId = params.get('id');
        const ablyKey = atob(params.get('key') || '');
        const imgbbKey = atob(params.get('imgbb') || '');

        if (!kioskId || !ablyKey) {
            document.body.innerHTML = '<h2 style="color:red">Invalid Pairing. Scan QR again.</h2>';
            throw new Error('Invalid pairing parameters');
        }

        if (sessionStorage.getItem('disc-' + kioskId)) {
            document.getElementById('disconnected-screen').classList.add('visible');
            throw new Error('Session ended');
        }

        const _phoneId = Math.random().toString(36).substring(2, 10);

        const ably = new Ably.Realtime({ key: ablyKey });
        const channel = ably.channels.get(`kiosk-${kioskId}`);
        const cmdChannel = ably.channels.get(`kiosk-cmd-${kioskId}`);
        const myCmd = ably.channels.get(`kiosk-cmd-${kioskId}-${_phoneId}`);

        function endSession(reason) {
            clearInterval(window._hbInterval); window._hbInterval = null;
            ably.close();
            if (reason !== 'session_taken') {
                sessionStorage.setItem('disc-' + kioskId, '1');
            }
            if (reason === 'session_taken') {
                document.querySelector('.disc-title').textContent = 'Kiosk Busy';
                document.querySelector('.disc-sub').innerHTML = 'Another device is already connected.<br>Wait for them to disconnect, then scan the QR code again.';
            }
            document.getElementById('disconnected-screen').classList.add('visible');
        }

        function onConnectionLost(label) {
            clearInterval(window._hbInterval); window._hbInterval = null;
            setStatus(label, 'error');
        }

        cmdChannel.subscribe((msg) => {
            if (msg.name === 'kick') endSession();
        });

        myCmd.subscribe((msg) => {
            if (msg.name === 'kick') endSession(msg.data?.reason);
        });

        const statusDot  = document.getElementById('statusDot');
        const statusText = document.getElementById('status');

        function setStatus(msg, state) {
            statusText.textContent = msg;
            statusDot.className = 'status-dot ' + (state || '');
        }

        document.getElementById('pingBtn').onclick = () => {
            channel.publish('ping', { time: Date.now(), phoneId: _phoneId }, (err) => {
                if (err) alert('Server Error: ' + err.message);
                else alert('Confirmed: message delivered to kiosk!');
            });
            const ps = document.getElementById('pingStatus');
            ps.textContent = 'Ping sent — check kiosk screen.';
            ps.classList.add('visible');
            setTimeout(() => { ps.textContent = ''; ps.classList.remove('visible'); }, 3000);
        };

        ably.connection.on('connecting', () => setStatus('Connecting...', 'connecting'));
        ably.connection.on('connected',  () => {
            setStatus('Connected — Kiosk ' + kioskId, 'connected');
            // Announce presence immediately, then keep alive every 30 s
            channel.publish('heartbeat', { phoneId: _phoneId });
            if (!window._hbInterval) {
                window._hbInterval = setInterval(() => {
                    if (ably.connection.state === 'connected') channel.publish('heartbeat', { phoneId: _phoneId });
                }, 30000);
            }
        });
        ably.connection.on('disconnected', () => onConnectionLost('Disconnected'));
        ably.connection.on('failed',       () => onConnectionLost('Connection failed'));

        async function uploadToImgbb(file) {
            const formData = new FormData();
            formData.append('image', file);
            const resp = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, {
                method: 'POST',
                body: formData
            });
            const json = await resp.json();

            if (!json.success) {
                throw new Error(json.error ? json.error.message : 'ImgBB error');
            }

            return json.data.url;
        }

        function setupSlot(slot) {
            const btn = document.getElementById('btn' + slot);
            const fileInput = document.getElementById('file' + slot);
            const prev = document.getElementById('prev' + slot);
            const loading = document.getElementById('loading' + slot);
            const card = document.getElementById('card' + slot);

            btn.onclick = () => fileInput.click();

            fileInput.onchange = async () => {
                const file = fileInput.files[0];
                if (!file) return;

                const previewUrl = URL.createObjectURL(file);
                prev.src = previewUrl;
                prev.style.display = 'block';
                card.classList.remove('uploaded');

                try {
                    btn.disabled = true;
                    loading.style.display = 'block';

                    let payload;
                    if (imgbbKey) {
                        loading.textContent = 'Uploading...';
                        const resizedBlob = await resizeImage(file, 2000);
                        const url = await uploadToImgbb(resizedBlob);
                        payload = { url };
                    } else {
                        loading.textContent = 'Processing...';
                        const resizedBlob = await resizeImage(file, 600);
                        const base64 = await blobToBase64(resizedBlob);
                        payload = { base64 };
                    }

                    loading.textContent = 'Sending...';
                    channel.publish('upload', { ...payload, slot, phoneId: _phoneId }, (err) => {
                        if (err) { loading.textContent = '⚠ Send failed'; loading.style.color = '#d47070'; }
                    });

                    loading.textContent = '✅ Sent!';
                    card.classList.add('uploaded');
                    setTimeout(() => { loading.style.display = 'none'; loading.style.color = ''; btn.disabled = false; }, 2000);
                } catch (e) {
                    loading.textContent = '⚠ ' + e.message;
                    loading.style.color = '#d47070';
                    setTimeout(() => { loading.style.display = 'none'; loading.style.color = ''; btn.disabled = false; }, 3000);
                }
            };
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        function resizeImage(source, maxSide) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const blobUrl = URL.createObjectURL(source);
                img.onload = () => {
                    URL.revokeObjectURL(blobUrl);
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; } }
                    else { if (h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Resize failed')), 'image/jpeg', 0.85);
                };
                img.onerror = () => { URL.revokeObjectURL(blobUrl); reject(new Error('Image load failed')); };
                img.src = blobUrl;
            });
        }

        setupSlot(1);
        setupSlot(2);

        document.getElementById('disconnectBtn').onclick = function () {
            this.disabled = true;
            channel.publish('disconnect', { phoneId: _phoneId }, () => endSession());
        };
    </script>
</body>

</html>
